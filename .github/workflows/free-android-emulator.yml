name: Free Android emulator smoke (no paid device farm)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Installed APK and JNI smoke on free GitHub emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Confirm committed binaries have not changed
        run: |
          set -euo pipefail
          sha256sum -c ci/PREBUILT_SHA256SUMS
          python3 tools/test_vendored_android_libraries.py
          python3 tools/test_ffmpeg_runtime_dependencies.py
          python3 tools/test_free_emulator_ci.py
      - name: Exclude Code On The Go-only debug provider from hosted emulator
        run: |
          test -f app/src/debug/AndroidManifest.xml
          grep -q 'com.itsaky.androidide.logsender.utils.LogSenderInstaller' app/src/debug/AndroidManifest.xml
          rm app/src/debug/AndroidManifest.xml
      - name: Unit tests and lint MUST pass before APK packaging
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Package actual debug and instrumentation APKs after tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview
      - name: Build real R8-minified Release with ephemeral CI debug certificate
        shell: bash
        run: |
          set -euo pipefail
          # Debug assembly generated this disposable certificate. NEVER use the
          # owner's production signing secrets on PRs or untrusted code.
          test -s "$HOME/.android/debug.keystore"
          ANDROID_KEYSTORE_PATH="$HOME/.android/debug.keystore" \
          ANDROID_KEYSTORE_PASSWORD=android \
          ANDROID_KEY_ALIAS=androiddebugkey \
          ANDROID_KEY_PASSWORD=android \
            ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Keep Release startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-release-startup-diagnostics
          path: build/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Enable KVM on standard public GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot API 35 emulator and execute real installed APK tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/free_emulator_smoke.sh
      - name: Preserve instrumentation and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-free-emulator-smoke-logs
          path: |
            build/emulator-diagnostics/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
