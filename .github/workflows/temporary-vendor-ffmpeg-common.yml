name: Temporary vendor missing FFmpeg runtime dependency

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  import-authentic-common-jar:
    name: Verify and import Smart Exception common 0.2.1
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/free-android-emulator-ci' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/free-android-emulator-ci
          persist-credentials: true
      - name: Download authentic upstream Maven Central JAR and validate classes
        run: |
          set -euo pipefail
          mkdir -p app/libs
          url=https://repo.maven.apache.org/maven2/com/arthenica/smart-exception-common/0.2.1/smart-exception-common-0.2.1.jar
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 120 "$url" -o app/libs/smart-exception-common-0.2.1.jar
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 30 "${url}.sha1" -o /tmp/smart-common.sha1
          expected=$(tr -dc '[:xdigit:]' </tmp/smart-common.sha1 | cut -c1-40)
          test "${#expected}" = 40
          echo "$expected  app/libs/smart-exception-common-0.2.1.jar" | sha1sum -c -
          unzip -tq app/libs/smart-exception-common-0.2.1.jar
          unzip -Z1 app/libs/smart-exception-common-0.2.1.jar | grep -qx 'com/arthenica/smartexception/PackageLoader.class'
          sha256sum app/libs/smart-exception-common-0.2.1.jar
      - name: Publish only verified missing JAR in authorized PR branch
        run: |
          set -euo pipefail
          if ! grep -q 'smart-exception-common-0.2.1.jar' ci/PREBUILT_SHA256SUMS; then
            sha256sum app/libs/smart-exception-common-0.2.1.jar >> ci/PREBUILT_SHA256SUMS
          fi
          sha256sum -c ci/PREBUILT_SHA256SUMS
          python3 tools/test_ffmpeg_runtime_dependencies.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f app/libs/smart-exception-common-0.2.1.jar
          git add ci/PREBUILT_SHA256SUMS
          if git diff --cached --quiet; then
            echo 'Already present and verified'
            exit 0
          fi
          git commit -m 'fix(android): vendor missing Smart Exception common dependency for FFmpegKit'
          git push origin HEAD:refs/heads/test/free-android-emulator-ci
