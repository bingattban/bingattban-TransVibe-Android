name: Temporary import of verified TransVibe prebuilt binaries

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage-prebuilt-on-feature-branch:
    name: Verify, build corrected JNI, and commit verified libraries
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/vendor-verified-binaries' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the authorized feature branch
        uses: actions/checkout@v4
        with:
          ref: build/vendor-verified-binaries
          persist-credentials: true
      - name: Tests before changing binaries
        run: |
          set -euo pipefail
          bash tools/audit_project.sh
          python3 tools/test_repository_layout.py
          python3 tools/test_native_jni_contract.py
          python3 tools/test_ci_aar_contract.py
          python3 tools/test_benchmark_compare.py
      - name: Download already-verified CPU JNI from successful GitHub Actions run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43907371011 --repo "$GITHUB_REPOSITORY" --name transvibe-native-arm64-cpu --dir native-output
          sha256sum -c native-output/SHA256SUMS
          grep -q "whisper_upstream_version=v1.9.4" native-output/transvibe_native_provenance.txt
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native-output/libtransvibe_native.so app/src/main/jniLibs/arm64-v8a/libtransvibe_native.so
          python3 tools/verify_native_jni_contract.py --project . --library app/src/main/jniLibs/arm64-v8a/libtransvibe_native.so
      - name: Fetch original user-matched FFmpeg and Sherpa AARs
        run: |
          set -euo pipefail
          bash ci/download_verified_aars.sh
      - name: Fetch and verify exact user-supplied ONNX and Smart Exception binaries
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 900 \
            https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.27.0/onnxruntime-android-1.27.0.aar \
            -o app/libs/onnxruntime-android-1.27.0.aar
          printf '%s  %s\n' '077dec5e2d821234c7dc0aba584bec8f999854b546c754cab93a90741c56fbeb' 'app/libs/onnxruntime-android-1.27.0.aar' | sha256sum -c -
          unzip -tq app/libs/onnxruntime-android-1.27.0.aar
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 120 \
            https://repo.maven.apache.org/maven2/com/arthenica/smart-exception-java/0.2.1/smart-exception-java-0.2.1.jar \
            -o app/libs/smart-exception-java-0.2.1.jar
          printf '%s  %s\n' '5b96aaa5f191dedbef72fb0c38f1a2b01807920afc0d92a75a2acd6e0cc7703c' 'app/libs/smart-exception-java-0.2.1.jar' | sha256sum -c -
          unzip -tq app/libs/smart-exception-java-0.2.1.jar
      - name: Validate all binary contracts and publish Git content
        run: |
          set -euo pipefail
          mkdir -p ci
          sha256sum \
            app/libs/ffmpeg-kit-min-gpl-6.0-2.aar \
            app/libs/sherpa-onnx-1.13.5.aar \
            app/libs/onnxruntime-android-1.27.0.aar \
            app/libs/smart-exception-java-0.2.1.jar \
            app/src/main/jniLibs/arm64-v8a/libtransvibe_native.so \
            > ci/PREBUILT_SHA256SUMS
          python3 tools/test_vendored_android_libraries.py
          sha256sum -c ci/PREBUILT_SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            app/libs/ffmpeg-kit-min-gpl-6.0-2.aar \
            app/libs/sherpa-onnx-1.13.5.aar \
            app/libs/onnxruntime-android-1.27.0.aar \
            app/libs/smart-exception-java-0.2.1.jar \
            app/src/main/jniLibs/arm64-v8a/libtransvibe_native.so
          git add ci/PREBUILT_SHA256SUMS
          if git diff --cached --quiet; then
            echo "Already vendored and verified, nothing to commit"
            exit 0
          fi
          git commit -m "build(android): vendor four pinned libraries and corrected ARM64 JNI"
          git push origin HEAD:refs/heads/build/vendor-verified-binaries
