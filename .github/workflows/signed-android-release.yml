name: Signed TransVibe Release (trusted main)

# Secrets are NEVER made available to pull_request or forked code.
# Sign only the exact main commit whose full Android CI already succeeded.
on:
  workflow_run:
    workflows: ["Android Tests First and ARM64 APK"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: transvibe-signed-release-main
  cancel-in-progress: false

jobs:
  signed-release:
    name: Verify trusted main and sign official ARM64 release APK
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Reject obsolete or untrusted revisions before accessing secrets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags --depth=1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" || {
            echo "Main has moved since tests finished; refusing to sign an old commit."
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned Android SDK tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate already-tested pinned Android libraries
        run: |
          set -euo pipefail
          sha256sum -c ci/PREBUILT_SHA256SUMS
          python3 tools/test_release_signing_contract.py
          python3 tools/test_apk_artifact_separation.py
          python3 tools/verify_native_jni_contract.py --project . --library app/src/main/jniLibs/arm64-v8a/libtransvibe_native.so
      - name: Build separate testing APK with no release secrets
        run: |
          set -euo pipefail
          # Uses disposable Debug signing; package com.transvibe.app.preview.
          # A TEST APK cannot overwrite or conflict with the official Release.
          ./gradlew --no-daemon :app:assemblePreview
          apk="app/build/outputs/apk/preview/app-preview.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.transvibe.app.preview' versionCode='4' versionName='1.0.3'"
          mkdir -p dist/test
          cp "$apk" dist/test/TransVibe-v1.0.3-TEST.apk
          sha256sum dist/test/TransVibe-v1.0.3-TEST.apk

      - name: Restore owner's signing keystore only into temporary private storage
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository Actions secret: $name"
              exit 1
            fi
          done
          install -d -m 700 "$RUNNER_TEMP/transvibe-signing"
          key_file="$RUNNER_TEMP/transvibe-signing/signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file" || { echo "The decoded keystore is empty"; exit 1; }
          keytool -list -keystore "$key_file" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"
          echo "Owner's keystore and alias were validated without displaying secret contents."
      - name: Build signed Release APK (after passing full Android tests)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify ML Kit reflective components survive R8 in actual Release
        run: python3 ci/verify_mlkit_registrars.py
      - name: Verify signature, identity, version, and signer certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          apk_cert_sha="$("$apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          key_cert_sha="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | sha256sum | cut -d ' ' -f1)"
          test -n "$apk_cert_sha"
          test "$apk_cert_sha" = "$key_cert_sha" || {
            echo "APK certificate differs from the owner's keystore: refusing to publish."
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.transvibe.app' versionCode='4' versionName='1.0.3'"
          mkdir -p dist/release
          cp "$apk" "dist/release/TransVibe-v1.0.3-RELEASE.apk"
          sha256sum dist/release/TransVibe-v1.0.3-RELEASE.apk
          echo "Release APK signature and version confirmed; only the public certificate fingerprint was recorded."
      - name: Remove private signing key before invoking third-party emulator action
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/transvibe-signing/signing.jks"
          rmdir "$RUNNER_TEMP/transvibe-signing" 2>/dev/null || true
          test ! -e "$ANDROID_KEYSTORE_PATH"
      - name: Enable KVM for official Release startup test
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start exactly the owner's signed APK before publishing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/release_apk_smoke.sh dist/release/TransVibe-v1.0.3-RELEASE.apk com.transvibe.app
      - name: Save official Release launch failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-signed-release-startup-diagnostics
          path: build/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish TEST APK as its own GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-v1.0.3-TEST
          path: dist/test/TransVibe-v1.0.3-TEST.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed RELEASE APK as a separate artifact
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-v1.0.3-RELEASE
          path: dist/release/TransVibe-v1.0.3-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keystore, including on failure
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/transvibe-signing/signing.jks"
          rmdir "$RUNNER_TEMP/transvibe-signing" 2>/dev/null || true
